name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android-webview/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create WebView Android project
        run: |
          mkdir -p android-webview/app/src/main/java/com/maquismanager/app
          mkdir -p android-webview/app/src/main/res/layout
          mkdir -p android-webview/app/src/main/res/values
          mkdir -p android-webview/app/src/main/res/xml

          cat > android-webview/settings.gradle << 'E'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "MaquisManager"
          include ':app'
          E

          cat > android-webview/build.gradle << 'E'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
          }
          E

          cat > android-webview/gradle.properties << 'E'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          E

          cat > android-webview/app/build.gradle << 'E'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.maquismanager.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.maquismanager.app"
              minSdk 22
              targetSdk 34
              versionCode 1
              versionName "1.0.0"
            }
            buildTypes {
              release { minifyEnabled false }
              debug { minifyEnabled false }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
          }
          E

          cat > android-webview/app/src/main/AndroidManifest.xml << 'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
              android:allowBackup="true"
              android:icon="@android:drawable/ic_menu_manage"
              android:label="@string/app_name"
              android:supportsRtl="true"
              android:theme="@style/Theme.MaquisManager"
              android:usesCleartextTraffic="false">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          E

          cat > android-webview/app/src/main/res/values/strings.xml << 'E'
          <resources><string name="app_name">Maquis Manager</string></resources>
          E

          cat > android-webview/app/src/main/res/values/themes.xml << 'E'
          <resources>
            <style name="Theme.MaquisManager" parent="Theme.MaterialComponents.DayNight.NoActionBar">
              <item name="android:statusBarColor">#0c0a09</item>
              <item name="android:navigationBarColor">#0c0a09</item>
              <item name="android:windowBackground">#0c0a09</item>
            </style>
          </resources>
          E

          cat > android-webview/app/src/main/res/layout/activity_main.xml << 'E'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0c0a09">
            <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
            <ProgressBar android:id="@+id/progress" style="?android:attr/progressBarStyleLarge"
              android:layout_width="wrap_content" android:layout_height="wrap_content"
              android:layout_gravity="center" android:indeterminate="true" />
          </FrameLayout>
          E

          cat > android-webview/app/src/main/java/com/maquismanager/app/MainActivity.java << 'E'
          package com.maquismanager.app;
          import android.annotation.SuppressLint;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private ProgressBar progress;
            private static final String APP_URL = "https://maquis-manager-ai-a-jour.vercel.app/";
            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);
              webView = findViewById(R.id.webview);
              progress = findViewById(R.id.progress);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              webView.setWebViewClient(new WebViewClient() {
                @Override public void onPageStarted(WebView v, String u, Bitmap f) { progress.setVisibility(View.VISIBLE); }
                @Override public void onPageFinished(WebView v, String u) { progress.setVisibility(View.GONE); }
                @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                  if (r.isForMainFrame()) {
                    progress.setVisibility(View.GONE);
                    Toast.makeText(MainActivity.this, "Connexion impossible. Verifiez Internet.", Toast.LENGTH_LONG).show();
                  }
                }
              });
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl(APP_URL);
            }
            @Override public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }
          }
          E

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: android-webview
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaquisManager-APK
          path: android-webview/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
